<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Môn học - QUẢN LÝ LỊCH HỌC</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/monhoc.css">
    <script>
        if (localStorage.getItem("isLoggedIn") !== "true") {
            window.location.replace("dangnhap.html");
        }
    </script>
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <i class="fa-solid fa-graduation-cap"></i>
            <span>QUẢN LÝ LỊCH HỌC</span>
        </div>
        <nav class="nav-links">
            <a href="trangchu.html">Trang chủ</a>
            <a href="lichhoc.html">Lịch học</a>
            <a href="monhoc.html" class="active">Môn học</a>
            <a href="thongbao.html">Thông báo</a>
            <a href="taikhoan.html">Tài khoản</a>
        </nav>
        <div class="nav-actions">
            <a href="dangnhap.html" class="in-login" id="loginBtn">
                <i class="fa-regular fa-user"></i>
                Đăng nhập
            </a>
            <button type="button" class="out-login" id="logoutBtn" hidden>
                <i class="fa-solid fa-right-from-bracket"></i>
                Đăng xuất
            </button>
        </div>
    </header>

    <main class="content">
        <div class="subject-page">

            <div class="page-head">
                <h1><i class="fa-solid fa-book"></i> MÔN HỌC</h1>
                <button type="button" class="btn btn-primary" id="btnAdd">
                    <i class="fa-solid fa-plus"></i> Thêm môn học
                </button>
            </div>

            <div class="subject-toolbar">
                <input type="search" id="searchInput" placeholder="Tìm theo mã môn, tên môn hoặc giảng viên" aria-label="Tìm môn học">
            </div>

            <div class="table-wrap">
                <table class="subject-table">
                    <thead>
                        <tr>
                            <th>STT</th>
                            <th>Mã môn</th>
                            <th>Tên môn học</th>
                            <th>Giảng viên</th>
                            <th>Số tín chỉ</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="subjectBody"></tbody>
                </table>
            </div>

            <p class="empty-text" id="emptyText" hidden>Chưa có môn học nào. Bấm "Thêm môn học" để bắt đầu.</p>

        </div>
    </main>

    <div class="modal" id="formModal" hidden>
        <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="formTitle">
            <div class="modal-head">
                <h2 id="formTitle">Thêm môn học</h2>
                <button type="button" class="icon-btn" data-close aria-label="Đóng"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <form id="subjectForm" novalidate>
                <input type="hidden" id="fId">

                <div class="field-row">
                    <div class="field">
                        <label for="fCode">Mã môn</label>
                        <input type="text" id="fCode" placeholder="Ví dụ: IT101" maxlength="20">
                        <small class="err" data-err="code"></small>
                    </div>
                    <div class="field">
                        <label for="fCredit">Số tín chỉ</label>
                        <input type="number" id="fCredit" min="1" max="10" value="3">
                        <small class="err" data-err="credit"></small>
                    </div>
                </div>

                <div class="field">
                    <label for="fName">Tên môn học</label>
                    <input type="text" id="fName" placeholder="Nhập tên môn học" maxlength="80">
                    <small class="err" data-err="name"></small>
                </div>

                <div class="field-row">
                    <div class="field">
                        <label for="fTeacher">Giảng viên</label>
                        <input type="text" id="fTeacher" placeholder="Nhập tên giảng viên" maxlength="60">
                        <small class="err" data-err="teacher"></small>
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-outline" data-close>Hủy</button>
                    <button type="submit" class="btn btn-primary" id="btnSubmit">Thêm môn học</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal" id="confirmModal" hidden>
        <div class="modal-box small" role="alertdialog" aria-modal="true" aria-labelledby="confirmText">
            <div class="result-icon warn"><i class="fa-solid fa-triangle-exclamation"></i></div>
            <p class="result-text" id="confirmText">Bạn có chắc muốn xóa môn học này?</p>
            <div class="modal-actions center">
                <button type="button" class="btn btn-outline" data-close>Hủy</button>
                <button type="button" class="btn btn-danger" id="confirmYes">Xóa môn học</button>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Quản lý lịch học. Tất cả các quyền được bảo lưu.</p>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/monhoc.js"></script>

</body>
</html>
