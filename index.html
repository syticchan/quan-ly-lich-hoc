<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUẢN LÝ LỊCH HỌC</title>
    <!-- Thư viện Icon FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> 
    <!-- 1. CSS DÙNG CHUNG (BẮT BUỘC) -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- NAV / HEADER DÙNG CHUNG -->
    <header class="navbar">
        <div class="logo">
            <i class="fa-solid fa-graduation-cap"></i>
            <span>QUẢN LÝ LỊCH HỌC</span>
        </div>
        <nav class="nav-links">
            <a href="trangchu.html" class="active">Trang chủ</a>
            <a href="lichhoc.html">Lịch học</a>
            <a href="monhoc.html">Môn học</a>
            <a href="thongbao.html">Thông báo</a>
            <a href="taikhoan.html">Tài khoản</a>
        </nav>
        <div class="nav-actions">
        <!-- Hiển thị khi chưa đăng nhập -->
            <a href="dangnhap.html" class="in-login" id="loginBtn">
                <i class="fa-regular fa-user"></i>
                Đăng nhập
            </a>

        <!-- Hiển thị khi đã đăng nhập -->
            <button type="button" class="out-login" id="logoutBtn" hidden>
                <i class="fa-solid fa-right-from-bracket"></i>
                Đăng xuất
            </button>
        </div>
    </header>


    <!-- THÂN TRANG (MỖI BẠN VIẾT NỘI DUNG VÀO ĐÂY) -->
    <main class="content">
        <!-- Nội dung riêng của từng trang sẽ nằm ở đây -->
    </main>

    <footer>
        <p>&copy; 2026 Quản lý lịch học. Tất cả các quyền được bảo lưu.</p>
    </footer>

    <!-- File JavaScript dùng chung -->
    <script src="js/main.js"></script>
    <script>
        if (localStorage.getItem("isLoggedIn") !== "true") {
        window.location.replace("dangnhap.html");
        }
        if (localStorage.getItem("isLoggedIn") === "true") {
            window.location.replace("trangchu.html");
        }
    </script>
