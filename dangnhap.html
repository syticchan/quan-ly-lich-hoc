<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Đăng nhập | Quản lý lịch học</title>

  <!-- CSS của trang đăng nhập -->
  <link rel="stylesheet" href="css/dangnhap.css">

  <!-- Font chữ -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- Font Awesome 6.4.0 -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  >
</head>

<body>
  <main class="login-page">
    <!-- Vòng tròn trang trí nền -->
    <div class="background-rings" aria-hidden="true"></div>

    <!-- Khung đăng nhập -->
    <section class="login-card">

      <!-- Logo -->
      <a class="brand" href="dangnhap.html">
        <i class="fa-solid fa-graduation-cap brand-icon"></i>
        <span>QUẢN LÝ LỊCH HỌC</span>
      </a>

      <!-- Tiêu đề -->
      <header class="login-heading">
        <h1>Chào mừng trở lại!</h1>
        <p>Đăng nhập vào tài khoản của bạn</p>
      </header>

      <!-- Form đăng nhập -->
      <form id="loginForm" novalidate>

        <!-- Email hoặc mã sinh viên -->
        <div class="form-group">
          <label for="email">Email</label>

          <div class="input-wrap">
            <i class="fa-solid fa-user input-icon"></i>

            <input
              type="text"
              id="email"
              name="email"
              placeholder="Vui lòng nhập email"
              autocomplete="username"
              required
            >
          </div>

          <small class="error-message" id="emailError"></small>
        </div>

        <!-- Mật khẩu -->
        <div class="form-group">
          <label for="password">Mật khẩu</label>

          <div class="input-wrap">
            <i class="fa-solid fa-lock input-icon"></i>

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Nhập mật khẩu"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="toggle-password"
              id="togglePassword"
              aria-label="Hiện mật khẩu"
              title="Hiện hoặc ẩn mật khẩu"
            >
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>

          <small class="error-message" id="passwordError"></small>
        </div>

        <!-- Ghi nhớ và quên mật khẩu -->
        <div class="form-options">
          <label class="remember-option">
            <input type="checkbox" id="rememberMe">
            <span>Ghi nhớ đăng nhập</span>
          </label>

          <button
            type="button"
            class="text-button"
            id="forgotPassword"
          >
            Quên mật khẩu?
          </button>
        </div>

        <!-- Nút đăng nhập -->
        <button class="login-button" type="submit">
          <span>Đăng nhập</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>

        <!-- Thông báo -->
        <p
          class="form-message"
          id="formMessage"
          role="status"
          aria-live="polite"
        ></p>
      </form>

    </section>
  </main>

  <!-- JavaScript -->
  <script src="js/dangnhap.js"></script>
</body>
</html>
