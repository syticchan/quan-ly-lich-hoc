<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - QUẢN LÝ LỊCH HỌC</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/dangnhap.css">
</head>
<body>

    <main class="login-page">
        <div class="background-rings" aria-hidden="true"></div>

        <section class="login-card">

            <a class="brand" href="trangchu.html">
                <i class="fa-solid fa-graduation-cap brand-icon"></i>
                <span>QUẢN LÝ LỊCH HỌC</span>
            </a>

            <header class="login-heading">
                <h1 id="headingTitle">Chào mừng trở lại!</h1>
                <p id="headingText">Đăng nhập vào tài khoản của bạn</p>
            </header>

            <form id="loginForm" novalidate>

                <div class="form-group">
                    <label for="loginId">Email hoặc mã sinh viên</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-user input-icon"></i>
                        <input type="text" id="loginId" name="loginId" placeholder="Nhập email hoặc mã sinh viên" autocomplete="username" required>
                    </div>
                    <small class="error-message" id="loginIdError"></small>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Mật khẩu</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="loginPassword" name="password" placeholder="Nhập mật khẩu" autocomplete="current-password" required>
                        <button type="button" class="toggle-password" data-target="loginPassword" aria-label="Hiện mật khẩu" title="Hiện hoặc ẩn mật khẩu">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                    <small class="error-message" id="loginPasswordError"></small>
                </div>

                <div class="form-options">
                    <label class="remember-option">
                        <input type="checkbox" id="rememberMe">
                        <span>Ghi nhớ đăng nhập</span>
                    </label>
                    <button type="button" class="text-button" id="forgotPassword">Quên mật khẩu?</button>
                </div>

                <button class="login-button" type="submit">
                    <span>Đăng nhập</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

                <p class="form-message" id="loginMessage" role="status" aria-live="polite"></p>

                <p class="form-switch">
                    Chưa có tài khoản?
                    <button type="button" class="text-button" id="showRegister">Đăng ký</button>
                </p>
            </form>

            <form id="registerForm" novalidate hidden>

                <div class="form-group">
                    <label for="regName">Họ và tên</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-id-card input-icon"></i>
                        <input type="text" id="regName" name="name" placeholder="Ví dụ: Nguyễn Văn A" autocomplete="name" required>
                    </div>
                    <small class="error-message" id="regNameError"></small>
                </div>

                <div class="form-group">
                    <label for="regEmail">Email</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-envelope input-icon"></i>
                        <input type="email" id="regEmail" name="email" placeholder="Ví dụ: id@gmail.com" autocomplete="email" required>
                    </div>
                    <small class="error-message" id="regEmailError"></small>
                </div>

                <div class="form-group">
                    <label for="regStudentId">Mã sinh viên</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-id-badge input-icon"></i>
                        <input type="text" id="regStudentId" name="studentId" placeholder="Nhập 9 chữ số" inputmode="numeric" autocomplete="off" required>
                    </div>
                    <small class="error-message" id="regStudentIdError"></small>
                </div>

                <div class="form-group">
                    <label for="regPassword">Mật khẩu</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="regPassword" name="password" placeholder="Tối thiểu 8 ký tự, gồm a-z, A-Z, 0-9" autocomplete="new-password" required>
                        <button type="button" class="toggle-password" data-target="regPassword" aria-label="Hiện mật khẩu" title="Hiện hoặc ẩn mật khẩu">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                    <small class="error-message" id="regPasswordError"></small>
                </div>

                <div class="form-group">
                    <label for="regConfirm">Xác nhận mật khẩu</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="regConfirm" name="confirmPassword" placeholder="Nhập lại mật khẩu" autocomplete="new-password" required>
                        <button type="button" class="toggle-password" data-target="regConfirm" aria-label="Hiện mật khẩu" title="Hiện hoặc ẩn mật khẩu">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                    <small class="error-message" id="regConfirmError"></small>
                </div>

                <button class="login-button" type="submit">
                    <span>Đăng ký</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

                <p class="form-message" id="registerMessage" role="status" aria-live="polite"></p>

                <p class="form-switch">
                    Đã có tài khoản?
                    <button type="button" class="text-button" id="showLogin">Đăng nhập</button>
                </p>
            </form>

        </section>
    </main>

    <script src="js/main.js"></script>
    <script src="js/dangnhap.js"></script>

</body>
</html>
