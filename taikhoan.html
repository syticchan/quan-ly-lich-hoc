<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tài khoản - QUẢN LÝ LỊCH HỌC</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/taikhoan.css">
    <script>
        if (localStorage.getItem("isLoggedIn") !== "true") {
            window.location.replace("dangnhap.html");
        }
    </script>
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <i class="fa-solid fa-graduation-cap"></i>
            <span>QUẢN LÝ LỊCH HỌC</span>
        </div>
        <nav class="nav-links">
            <a href="trangchu.html">Trang chủ</a>
            <a href="lichhoc.html">Lịch học</a>
            <a href="monhoc.html">Môn học</a>
            <a href="thongbao.html">Thông báo</a>
            <a href="taikhoan.html" class="active">Tài khoản</a>
        </nav>
        <div class="nav-actions">
            <a href="dangnhap.html" class="in-login" id="loginBtn">
                <i class="fa-regular fa-user"></i>
                Đăng nhập
            </a>
            <button type="button" class="out-login" id="logoutBtn" hidden>
                <i class="fa-solid fa-right-from-bracket"></i>
                Đăng xuất
            </button>
        </div>
    </header>

    <main class="content">
        <div class="container-card">

            <section class="banner">
                <h1>Quản lý thông tin cá nhân</h1>
            </section>

            <div class="content-grid">
                <section class="card">
                    <div class="card-title">
                        <h2>Thông tin cá nhân</h2>
                    </div>

                    <div class="profile-content">
                        <div class="profile-fields">

                            <div class="info-row">
                                <div>
                                    <div class="info-label">Họ và tên</div>
                                    <div class="info-value" data-field="name"></div>
                                </div>
                            </div>

                            <div class="info-row">
                                <div>
                                    <div class="info-label">Mã sinh viên</div>
                                    <div class="info-value" data-field="studentId"></div>
                                </div>
                            </div>

                            <div class="info-row">
                                <div>
                                    <div class="info-label">Email</div>
                                    <div class="info-value" data-field="email"></div>
                                </div>
                            </div>

                            <div class="info-row">
                                <div>
                                    <div class="info-label">Trường</div>
                                    <div class="info-value" data-field="school"></div>
                                </div>
                            </div>

                            <div class="info-row">
                                <div>
                                    <div class="info-label">Khoa</div>
                                    <div class="info-value" data-field="faculty"></div>
                                </div>
                            </div>

                            <div class="info-row">
                                <div>
                                    <div class="info-label">Lớp</div>
                                    <div class="info-value" data-field="className"></div>
                                </div>
                            </div>

                        </div>
                    </div>
                </section>

                <section class="card">
                    <div class="card-title">
                        <h2>Cài đặt</h2>
                    </div>

                    <div class="settings-list">
                        <button type="button" class="setting-item" data-modal="editModal">
                            <i class="fa-solid fa-pen"></i>
                            <span class="setting-info">
                                <span class="setting-name">Chỉnh sửa thông tin</span>
                            </span>
                            <span class="chevron">›</span>
                        </button>

                        <button type="button" class="setting-item" data-modal="passwordModal">
                            <i class="fa-solid fa-lock"></i>
                            <span class="setting-info">
                                <span class="setting-name">Đổi mật khẩu</span>
                            </span>
                            <span class="chevron">›</span>
                        </button>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <div class="modal" id="editModal" hidden>
        <div class="modal-box" role="dialog" aria-modal="true">
            <div class="modal-head">
                <h2>Chỉnh sửa thông tin</h2>
                <button type="button" class="icon-btn" data-close aria-label="Đóng">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="editForm" novalidate>
                <div class="field">
                    <label for="editName">Họ và tên</label>
                    <input id="editName" name="name" maxlength="50">
                    <span class="err"></span>
                </div>

                <div class="field">
                    <label for="editEmail">Email</label>
                    <input id="editEmail" name="email" type="email" maxlength="100">
                    <span class="err"></span>
                </div>

                <div class="field">
                    <label for="editStudentId">Mã sinh viên</label>
                    <input id="editStudentId" name="studentId" inputmode="numeric" maxlength="9">
                    <span class="err"></span>
                </div>

                <div class="field">
                    <label for="editSchool">Trường</label>
                    <input id="editSchool" name="school" placeholder="Chưa có" maxlength="100">
                    <span class="err"></span>
                </div>

                <div class="field">
                    <label for="editFaculty">Khoa</label>
                    <input id="editFaculty" name="faculty" placeholder="Chưa có" maxlength="100">
                    <span class="err"></span>
                </div>

                <div class="field">
                    <label for="editClass">Lớp</label>
                    <input id="editClass" name="className" placeholder="Chưa có" maxlength="100">
                    <span class="err"></span>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-outline" data-close>Hủy</button>
                    <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal" id="passwordModal" hidden>
        <div class="modal-box" role="dialog" aria-modal="true">
            <div class="modal-head">
                <h2>Đổi mật khẩu</h2>
                <button type="button" class="icon-btn" data-close aria-label="Đóng">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="passwordForm" novalidate>
                <div class="field">
                    <label for="currentPassword">Mật khẩu hiện tại</label>
                    <input id="currentPassword" type="password">
                    <span class="err"></span>
                </div>

                <div class="field">
                    <label for="newPassword">Mật khẩu mới</label>
                    <input id="newPassword" type="password" placeholder="Tối thiểu 8 ký tự, gồm a-z, A-Z, 0-9">
                    <span class="err"></span>
                </div>

                <div class="field">
                    <label for="confirmPassword">Xác nhận mật khẩu mới</label>
                    <input id="confirmPassword" type="password" placeholder="Nhập lại mật khẩu">
                    <span class="err"></span>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-outline" data-close>Hủy</button>
                    <button type="submit" class="btn btn-primary">Cập nhật mật khẩu</button>
                </div>
            </form>
        </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <footer>
        <p>&copy; 2026 Quản lý lịch học. Tất cả các quyền được bảo lưu.</p>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/taikhoan.js"></script>

</body>
</html>
