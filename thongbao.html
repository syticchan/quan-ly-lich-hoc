<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông báo - QUẢN LÝ LỊCH HỌC</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/thongbao.css">
    <script>
        if (localStorage.getItem("isLoggedIn") !== "true") {
            window.location.replace("dangnhap.html");
        }
    </script>
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <i class="fa-solid fa-graduation-cap"></i>
            <span>QUẢN LÝ LỊCH HỌC</span>
        </div>
        <nav class="nav-links">
            <a href="trangchu.html">Trang chủ</a>
            <a href="lichhoc.html">Lịch học</a>
            <a href="monhoc.html">Môn học</a>
            <a href="thongbao.html" class="active">Thông báo</a>
            <a href="taikhoan.html">Tài khoản</a>
        </nav>
        <div class="nav-actions">
            <a href="dangnhap.html" class="in-login" id="loginBtn">
                <i class="fa-regular fa-user"></i>
                Đăng nhập
            </a>
            <button type="button" class="out-login" id="logoutBtn" hidden>
                <i class="fa-solid fa-right-from-bracket"></i>
                Đăng xuất
            </button>
        </div>
    </header>

    <main class="content">
        <div class="notice-page">

            <div class="page-head">
                <h1><i class="fa-solid fa-bell"></i> THÔNG BÁO</h1>
                <button type="button" class="btn btn-primary" id="btnAdd">
                    <i class="fa-solid fa-plus"></i> Thêm thông báo
                </button>
            </div>

            <div class="luoitruyenthong">
                <div class="cotdanhsach">
                    <div class="thanhboloc">
                        <button type="button" class="nutloc active" data-tab="tatca">Tất cả (0)</button>
                        <button type="button" class="nutloc" data-tab="chuadoc">Chưa đọc (0)</button>
                        <button type="button" class="nutloc" data-tab="dadoc">Đã đọc (0)</button>
                    </div>

                    <div class="danhsachitem" id="danhSachItem"></div>
                </div>

                <div class="cotchitiet" id="khungchitiet">
                    <h3 id="tieudecitiet"></h3>
                    <p class="thoigianchitiet" id="thoigianchitiet" hidden><i class="fa-regular fa-clock"></i> <span id="ngaygiochitiet"></span></p>
                    <div class="noidungchitiet" id="noidungchitiet"></div>
                    <div id="hanhdongchitiet" style="display:flex;gap:10px;flex-wrap:wrap" hidden>
                        <button type="button" class="btn btn-outline" id="btnToggleRead">
                            <i class="fa-regular fa-envelope"></i> Đánh dấu chưa đọc
                        </button>
                        <button type="button" class="btn btn-outline" id="btnDelete">
                            <i class="fa-regular fa-trash-can"></i> Xóa
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal thêm thông báo -->
    <div class="modal" id="formModal" hidden>
        <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="formTitle">
            <div class="modal-head">
                <h2 id="formTitle">Thêm thông báo mới</h2>
                <button type="button" class="icon-btn" data-close aria-label="Đóng"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="noticeForm" novalidate>
                <div class="field">
                    <label for="fTitle">Tiêu đề thông báo</label>
                    <input type="text" id="fTitle" placeholder="Nhập tiêu đề thông báo..." maxlength="150">
                    <small data-err="title" style="color:var(--danger-color);font-size:12px"></small>
                </div>
                <div class="field">
                    <label for="fContent">Nội dung chi tiết</label>
                    <textarea id="fContent" rows="4" placeholder="Nhập nội dung thông báo..."></textarea>
                    <small data-err="content" style="color:var(--danger-color);font-size:12px"></small>
                </div>
                <div class="field">
                    <label for="fDate">Ngày đăng</label>
                    <input type="date" id="fDate">
                    <small data-err="date" style="color:var(--danger-color);font-size:12px"></small>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-outline" data-close>Hủy</button>
                    <button type="submit" class="btn btn-primary" id="btnSubmit">Thêm thông báo</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal xác nhận xóa -->
    <div class="modal" id="confirmModal" hidden>
        <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
            <div class="modal-head">
                <h2 id="confirmTitle">Xác nhận xóa</h2>
                <button type="button" class="icon-btn" data-close aria-label="Đóng"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <p id="confirmText"></p>
            <div class="modal-actions">
                <button type="button" class="btn btn-outline" data-close>Hủy</button>
                <button type="button" class="btn btn-primary" id="confirmYes">Xóa</button>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Quản lý lịch học. Tất cả các quyền được bảo lưu.</p>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/thongbao.js"></script>

</body>
</html>
